  <rect x="0" y="4" width="2" height="4" fill="#0E0E0F"/>
  <rect x="10" y="4" width="2" height="4" fill="#0E0E0F"/>
  <rect x="2" y="2" width="2" height="2" fill="#0E0E0F"/>
