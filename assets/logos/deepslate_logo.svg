<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background radial glow -->
    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2ECC71" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#123D06" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#161718" stop-opacity="0"/>
    </radialGradient>

    <!-- Emerald crystal gradient -->
    <linearGradient id="crystalTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3E4D7"/>
      <stop offset="40%" stop-color="#2ECC71"/>
      <stop offset="100%" stop-color="#1E824C"/>
    </linearGradient>

    <linearGradient id="crystalLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ECC71"/>
      <stop offset="100%" stop-color="#145A32"/>
    </linearGradient>

    <linearGradient id="crystalRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E824C"/>
      <stop offset="100%" stop-color="#0E3A18"/>
    </linearGradient>

    <!-- Deepslate faces -->
    <linearGradient id="deepslateTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D4146"/>
      <stop offset="100%" stop-color="#2B2E32"/>
    </linearGradient>

    <linearGradient id="deepslateLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#272A2E"/>
      <stop offset="100%" stop-color="#1C1E21"/>
    </linearGradient>

    <linearGradient id="deepslateRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C1E"/>
      <stop offset="100%" stop-color="#101113"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="128" cy="128" r="120" fill="url(#emeraldGlow)"/>

  <!-- Outer Hexagonal Ore UI Crest Frame -->
  <polygon points="128,14 228,70 228,186 128,242 28,186 28,70" fill="#1C1D1E" stroke="#39393B" stroke-width="4"/>
  <polygon points="128,20 222,74 222,182 128,236 34,182 34,74" fill="#151617" stroke="#0E0E0F" stroke-width="2"/>

  <!-- Isometric Deepslate Block Group -->
  <g transform="translate(128, 128)">
    <!-- Base Cube Shadows -->
    <!-- Top Face (width 140, height 70 approx) -->
    <polygon points="0,-68 70,-28 0,12 -70,-28" fill="url(#deepslateTop)" stroke="#0E0E0F" stroke-width="3"/>

    <!-- Left Face -->
    <polygon points="-70,-28 0,12 0,92 -70,52" fill="url(#deepslateLeft)" stroke="#0E0E0F" stroke-width="3"/>

    <!-- Right Face -->
    <polygon points="0,12 70,-28 70,52 0,92" fill="url(#deepslateRight)" stroke="#0E0E0F" stroke-width="3"/>

    <!-- Deepslate Chiseled Layer Texture Striations (Top) -->
    <polygon points="-40,-24 -15,-10 -25,-6 -50,-20" fill="#4B5056"/>
    <polygon points="10,-4 -15,-18 5,-28 30,-14" fill="#202225"/>
    <polygon points="20,-48 45,-34 35,-30 10,-44" fill="#4B5056"/>

    <!-- Deepslate Strata Lines (Left Face) -->
    <polygon points="-70,-10 0,30 0,36 -70,-4" fill="#181A1C"/>
    <polygon points="-70,16 0,56 0,62 -70,22" fill="#181A1C"/>
    <polygon points="-50,0 -20,18 -20,24 -50,6" fill="#363A3F"/>
    <polygon points="-60,34 -10,64 -10,68 -60,38" fill="#363A3F"/>

    <!-- Deepslate Strata Lines (Right Face) -->
    <polygon points="0,30 70,-10 70,-4 0,36" fill="#0A0B0C"/>
    <polygon points="0,56 70,16 70,22 0,62" fill="#0A0B0C"/>
    <polygon points="20,18 50,0 50,6 20,24" fill="#222528"/>
    <polygon points="10,64 60,34 60,38 10,68" fill="#222528"/>

    <!-- Glowing Emerald Vein Cluster (Top Face) -->
    <polygon points="-8,-34 12,-44 26,-36 6,-26" fill="url(#crystalTop)" stroke="#0E0E0F" stroke-width="1.5"/>
    <polygon points="0,-18 16,-26 22,-22 6,-14" fill="url(#crystalTop)" stroke="#0E0E0F" stroke-width="1.5"/>
    <polygon points="-30,-18 -18,-24 -12,-20 -24,-14" fill="url(#crystalTop)" stroke="#0E0E0F" stroke-width="1.5"/>

    <!-- Glowing Emerald Vein (Left Face) -->
    <polygon points="-36,12 -22,20 -22,34 -36,26" fill="url(#crystalLeft)" stroke="#0E0E0F" stroke-width="1.5"/>
    <polygon points="-22,20 -10,26 -10,40 -22,34" fill="url(#crystalLeft)" stroke="#0E0E0F" stroke-width="1.5"/>
    <polygon points="-46,38 -32,46 -32,58 -46,50" fill="url(#crystalLeft)" stroke="#0E0E0F" stroke-width="1.5"/>

    <!-- Glowing Emerald Vein (Right Face) -->
    <polygon points="18,20 34,12 34,26 18,34" fill="url(#crystalRight)" stroke="#0E0E0F" stroke-width="1.5"/>
    <polygon points="34,12 48,18 48,32 34,26" fill="url(#crystalRight)" stroke="#0E0E0F" stroke-width="1.5"/>
    <polygon points="12,46 28,38 28,52 12,60" fill="url(#crystalRight)" stroke="#0E0E0F" stroke-width="1.5"/>

    <!-- High-intensity Core Light Specks -->
    <rect x="-4" y="-30" width="3" height="3" fill="#FFFFFF"/>
    <rect x="18" y="-38" width="3" height="3" fill="#FFFFFF"/>
    <rect x="-24" y="24" width="3" height="3" fill="#A3E4D7"/>
    <rect x="24" y="24" width="3" height="3" fill="#A3E4D7"/>
  </g>

  <!-- Crest Corner Rivets -->
  <circle cx="128" cy="24" r="3" fill="#4B9736"/>
  <circle cx="218" cy="74" r="3" fill="#4B9736"/>
  <circle cx="218" cy="182" r="3" fill="#4B9736"/>
  <circle cx="128" cy="232" r="3" fill="#4B9736"/>
  <circle cx="38" cy="182" r="3" fill="#4B9736"/>
  <circle cx="38" cy="74" r="3" fill="#4B9736"/>
</svg>
