<svg width="800" height="220" viewBox="0 0 800 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191A1B"/>
      <stop offset="50%" stop-color="#141516"/>
      <stop offset="100%" stop-color="#0E0F10"/>
    </linearGradient>
    <radialGradient id="emeraldBannerGlow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2ECC71" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#141516" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textEmerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A3E4D7"/>
      <stop offset="40%" stop-color="#2ECC71"/>
      <stop offset="100%" stop-color="#1E824C"/>
    </linearGradient>
  </defs>

  <!-- Banner Background -->
  <rect width="800" height="220" fill="url(#bannerBg)"/>
  <rect width="800" height="220" fill="url(#emeraldBannerGlow)"/>

  <!-- Beveled Ore UI Border -->
  <rect x="2" y="2" width="796" height="216" stroke="#39393B" stroke-width="4" fill="none"/>
  <rect x="6" y="6" width="788" height="208" stroke="#1C1D1D" stroke-width="2" fill="none"/>

  <!-- Logo Embedded on Left -->
  <g transform="translate(40, 10)">
    <!-- Hex Crest -->
    <polygon points="100,10 178,55 178,145 100,190 22,145 22,55" fill="#1C1D1E" stroke="#39393B" stroke-width="3"/>
    <polygon points="100,16 172,58 172,142 100,184 28,142 28,58" fill="#151617" stroke="#0E0E0F" stroke-width="2"/>

    <!-- Isometric Block Inside -->
    <g transform="translate(100, 100)">
      <polygon points="0,-52 52,-22 0,8 -52,-22" fill="#3D4146" stroke="#0E0E0F" stroke-width="2.5"/>
      <polygon points="-52,-22 0,8 0,68 -52,38" fill="#272A2E" stroke="#0E0E0F" stroke-width="2.5"/>
      <polygon points="0,8 52,-22 52,38 0,68" fill="#1A1C1E" stroke="#0E0E0F" stroke-width="2.5"/>

      <!-- Strata -->
      <polygon points="-52,-8 0,22 0,27 -52,-3" fill="#181A1C"/>
      <polygon points="-52,12 0,42 0,47 -52,17" fill="#181A1C"/>
      <polygon points="0,22 52,-8 52,-3 0,27" fill="#0A0B0C"/>
      <polygon points="0,42 52,12 52,17 0,47" fill="#0A0B0C"/>

      <!-- Emeralds -->
      <polygon points="-6,-26 9,-34 20,-28 5,-20" fill="#2ECC71" stroke="#0E0E0F" stroke-width="1"/>
      <polygon points="-27,9 -16,15 -16,26 -27,20" fill="#2ECC71" stroke="#0E0E0F" stroke-width="1"/>
      <polygon points="14,15 26,9 26,20 14,26" fill="#1E824C" stroke="#0E0E0F" stroke-width="1"/>
      <rect x="-3" y="-23" width="2" height="2" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Typography on Right -->
  <g transform="translate(250, 50)">
    <!-- Main Title with Shadow -->
    <text x="3" y="53" font-family="'Mojangles', sans-serif" font-size="44" font-weight="900" fill="#0E0E0F" letter-spacing="2">DEEPSLATE</text>
    <text x="0" y="50" font-family="'Mojangles', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="2">DEEPSLATE</text>

    <!-- Subtitle Badge -->
    <rect x="0" y="72" width="230" height="26" fill="#123D06" stroke="#2ECC71" stroke-width="1.5"/>
    <text x="12" y="90" font-family="'Mojangles', sans-serif" font-size="12" font-weight="bold" fill="#2ECC71" letter-spacing="1.5">BEDROCK EDITION LAUNCHER</text>

    <!-- Tagline -->
    <text x="0" y="130" font-family="'Mojangles', sans-serif" font-size="13" fill="#A0A0A0">Modern • Ore UI Themed • Update-Proof for Linux</text>
  </g>
</svg>
